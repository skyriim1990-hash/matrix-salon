# Sveltia / Decap CMS configuration.
# Replace OWNER/REPO below with your GitHub username and repository name
# (for example: janesmith/bella-hair-studio).
backend:
  name: github
  repo: OWNER/REPO
  branch: main

# Where uploaded photos are stored in the project, and the URL they're served from.
media_folder: "public/images"
public_folder: "/images"

collections:
  # ----- Services -------------------------------------------------------
  - name: services
    label: "Services"
    label_singular: "Service"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{price}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: "Name", widget: string }
      - { name: price, label: "Price", widget: string, hint: "e.g. $55 or from $90" }
      - { name: duration, label: "Duration", widget: string, required: false, hint: "e.g. 45 min" }
      - { name: order, label: "Sort order", widget: number, default: 0, value_type: int }
      - { name: description, label: "Description", widget: text }
      - { name: body, label: "Extra details (optional)", widget: markdown, required: false }

  # ----- Gallery --------------------------------------------------------
  - name: gallery
    label: "Gallery photos"
    label_singular: "Photo"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    summary: "{{alt}}"
    sortable_fields: [order]
    fields:
      - { name: image, label: "Photo", widget: image }
      - { name: alt, label: "Photo description (for accessibility)", widget: string }
      - { name: order, label: "Sort order", widget: number, default: 0, value_type: int }
      - { name: body, label: "Notes (optional)", widget: markdown, required: false }

  # ----- Site settings (single file) -----------------------------------
  - name: settings
    label: "Site settings"
    files:
      - name: business
        label: "Business details"
        file: "src/data/site.json"
        fields:
          - { name: businessName, label: "Business name", widget: string }
          - { name: tagline, label: "Tagline", widget: string }
          - { name: intro, label: "Welcome paragraph", widget: text }
          - { name: phone, label: "Phone", widget: string }
          - { name: email, label: "Email", widget: string }
          - { name: address, label: "Address", widget: string }
          - { name: mapsUrl, label: "Google Maps link", widget: string, required: false }
          - { name: bookingUrl, label: "Online booking link (optional)", widget: string, required: false, hint: "Paste a Fresha/Booksy/Calendly link to enable Book online buttons" }
          - { name: instagram, label: "Instagram link", widget: string, required: false }
          - { name: facebook, label: "Facebook link", widget: string, required: false }
          - name: hours
            label: "Opening hours"
            widget: list
            fields:
              - { name: day, label: "Day", widget: string }
              - { name: time, label: "Hours", widget: string, hint: "e.g. 9:00 – 18:00 or Closed" }
